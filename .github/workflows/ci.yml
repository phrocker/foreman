name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev,browser]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Initialize test registry
        run: foreman init
      - name: Check service scripts
        run: sh -n deploy/systemd/install.sh deploy/shoal/prepare-store.sh
      - name: Test
        run: python -m pytest -q

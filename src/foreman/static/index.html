<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreman</title>
<style>
  /* Status palette is fixed and never themed: severity is state, not identity.
     Medium (#ec835a) and low (#fab219) sit only 13.6 ΔE apart, which is below
     the threshold at which full-colour vision reliably separates them — so
     every severity carries a distinct SHAPE and a text label, and the colour is
     strictly redundant. Never encode severity with colour alone here. */
  :root {
    color-scheme: light;
    --page:        #f4f4f2;
    --surface:     #fcfcfb;
    --surface-alt: #efefec;
    --border:      #e0e0db;
    --border-firm: #cfcfc8;
    --text:        #0b0b0b;
    --text-2:      #52514e;
    --text-3:      #83827c;
    --accent:      #2a78d6;
    --high:        #d03b3b;
    --medium:      #ec835a;
    --low:         #fab219;
    --good:        #0ca30c;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #121211;
      --surface:     #1a1a19;
      --surface-alt: #232322;
      --border:      #2e2e2c;
      --border-firm: #3d3d3a;
      --text:        #ffffff;
      --text-2:      #c3c2b7;
      --text-3:      #8e8d85;
      --accent:      #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #121211;
    --surface:     #1a1a19;
    --surface-alt: #232322;
    --border:      #2e2e2c;
    --border-firm: #3d3d3a;
    --text:        #ffffff;
    --text-2:      #c3c2b7;
    --text-3:      #8e8d85;
    --accent:      #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding-bottom: 20px; margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .brand span { color: var(--text-3); font-weight: 400; margin-left: 8px; }
  .spacer { flex: 1; }

  button {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border-firm); border-radius: 8px;
    padding: 7px 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--surface-alt); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.icon { padding: 7px 10px; }

  /* Hero — exactly one per view. Proportional figures: tabular-nums makes a
     large standalone number read loose. */
  .hero {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  }
  .hero-figure { font-size: 54px; font-weight: 650; line-height: 1; letter-spacing: -0.03em; }
  .hero-label { color: var(--text-2); font-size: 14px; }
  .hero-note { color: var(--text-3); font-size: 13px; margin-left: auto; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .tile-label { color: var(--text-2); font-size: 12.5px; margin-bottom: 6px; }
  .tile-value { font-size: 25px; font-weight: 600; line-height: 1.1; }

  h2 { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase;
       letter-spacing: 0.06em; margin: 0 0 12px; }

  /* Filters live in one row above the data. */
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border-firm); background: var(--surface);
    cursor: pointer; font-size: 13px; color: var(--text-2);
  }
  .chip[aria-pressed="true"] { background: var(--surface-alt); color: var(--text); border-color: var(--text-3); }
  .chip .glyph { font-size: 11px; }
  input[type="search"], select {
    font: inherit; padding: 7px 11px; border-radius: 8px;
    border: 1px solid var(--border-firm); background: var(--surface); color: var(--text);
  }
  input[type="search"] { flex: 1; min-width: 170px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11.5px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--surface-alt); }
  .num { font-variant-numeric: tabular-nums; text-align: right; color: var(--text-2); }
  .project-cell { color: var(--text-2); white-space: nowrap; }

  /* Severity: shape + label + colour, in that order of importance. */
  .sev { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 13px; }
  .sev .glyph { font-size: 10px; line-height: 1; }
  .sev-high   { color: var(--high); }
  .sev-medium { color: var(--medium); }
  .sev-low    { color: var(--low); }
  .sev .txt { color: var(--text); }

  .detail td { background: var(--surface-alt); padding: 0 16px; }
  .detail-inner { padding: 14px 0 18px; }
  .detail p { margin: 0 0 12px; color: var(--text-2); max-width: 68ch; }
  .subjects { margin: 0; padding: 0; list-style: none;
              font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .subjects li { color: var(--text-2); word-break: break-all; }
  .rule-tag { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
              color: var(--text-3); }
  /* Provenance, not decoration: a rule finding is reproducible and a judgement
     call from an agent is not, and the reader has to be able to tell. */
  .src { font-size: 11px; padding: 1px 7px; border-radius: 999px; margin-left: 8px;
         border: 1px solid var(--border-firm); color: var(--text-3);
         white-space: nowrap; vertical-align: 1px; }

  #projectRows { max-height: 232px; overflow-y: auto; }
  .project-row { display: flex; align-items: center; gap: 12px; padding: 11px 16px;
              border-bottom: 1px solid var(--border); cursor: pointer; }
  .project-row:last-child { border-bottom: none; }
  .project-row:hover { background: var(--surface-alt); }
  .project-name { font-weight: 550; }
  .project-when { color: var(--text-3); font-size: 12.5px; margin-left: auto; white-space: nowrap; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px;
          padding: 2px 9px; border-radius: 999px; background: var(--surface-alt);
          border: 1px solid var(--border-firm); color: var(--text); }
  .pill .glyph { font-size: 9px; }
  .pill.clean { color: var(--good); }

  .empty { padding: 34px 16px; text-align: center; color: var(--text-3); }
  .log { margin-top: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border);
         border-radius: var(--radius); font: 12.5px/1.7 ui-monospace, Menlo, monospace;
         color: var(--text-2); max-height: 190px; overflow-y: auto; white-space: pre-wrap; }
  .err { color: var(--high); }
  section { margin-bottom: 30px; }
  /* Tabs */
  .tabs { display: flex; gap: 4px; margin: 0 0 16px; border-bottom: 1px solid var(--border); }
  .tab {
    border: none; background: none; border-radius: 0; padding: 9px 14px;
    color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { background: var(--surface-alt); color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 550; }
  .count { font-variant-numeric: tabular-nums; color: var(--text-3); font-size: 12px; margin-left: 3px; }
  .hint { color: var(--text-3); font-size: 12.5px; }

  /* Actions */
  .action {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 15px 17px; margin-bottom: 12px;
  }
  .action-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .verb { font-weight: 600; }
  .action-files { font: 12.5px ui-monospace, Menlo, monospace; color: var(--text-2); }
  .evidence { margin: 10px 0; }
  .evidence-text { font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  /* Track is a lighter step of the fill's own ramp so the bar reads as one
     object at any fill level, rather than two unrelated colours meeting. */
  .meter { height: 5px; border-radius: 3px; background: var(--surface-alt); overflow: hidden; }
  .meter > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .meter.earned > span { background: var(--good); }
  .statement {
    font: 12px/1.6 ui-monospace, Menlo, monospace; color: var(--text-3);
    background: var(--surface-alt); border-radius: 6px; padding: 9px 11px;
    margin: 10px 0; word-break: break-word; white-space: pre-wrap;
  }
  .action-buttons { display: flex; gap: 8px; align-items: center; }
  .badge {
    font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--border-firm); color: var(--text-3);
  }
  .badge.earned { color: var(--good); border-color: var(--good); }
  .stale { color: var(--medium); font-size: 13px; margin-top: 8px; }

  /* Drift */
  .drift { padding: 11px 16px; border-bottom: 1px solid var(--border); }
  .drift:last-child { border-bottom: none; }
  .drift-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
  .drift-subject { font: 12.5px ui-monospace, Menlo, monospace; word-break: break-all; }
  .drift-val { font: 12.5px/1.6 ui-monospace, Menlo, monospace; word-break: break-all; }
  .was { color: var(--high); }
  .now { color: var(--good); }

  /* Precision */
  .rule-row { padding: 11px 16px; border-bottom: 1px solid var(--border); }
  .rule-row:last-child { border-bottom: none; }
  .rule-head { display: flex; gap: 10px; align-items: baseline; }
  .rule-name { font: 12.5px ui-monospace, Menlo, monospace; }
  .rule-pct { margin-left: auto; font-variant-numeric: tabular-nums; }

  @media (max-width: 620px) {
    .hero-figure { font-size: 42px; }
    .hero-note { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Foreman <span id="lastRun">—</span></div>
    <div class="spacer"></div>
    <button id="runBtn" class="primary">Run sweep</button>
    <button id="themeBtn" class="icon" title="Toggle theme" aria-label="Toggle theme"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1a7 7 0 0 0 0 14z" fill="currentColor"/></svg></button>
  </header>

  <div class="hero">
    <div class="hero-figure" id="heroValue">—</div>
    <div class="hero-label">open findings<br><span id="heroBreak" class="rule-tag"></span></div>
    <div class="hero-note" id="heroNote"></div>
  </div>

  <div class="tiles" id="tiles"></div>
  <div id="log" class="log" hidden></div>

  <section>
    <h2>Projects</h2>
    <div class="panel" id="projectRows"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="findings" role="tab" aria-selected="true">Findings <span class="count" id="countFindings"></span></button>
    <button class="tab" data-tab="actions"  role="tab" aria-selected="false">Actions <span class="count" id="countActions"></span></button>
    <button class="tab" data-tab="drift"    role="tab" aria-selected="false">Drift <span class="count" id="countDrift"></span></button>
    <button class="tab" data-tab="rules"    role="tab" aria-selected="false">Rules</button>
  </nav>

  <section id="panel-findings" role="tabpanel">
    <div class="filters">
      <button class="chip" data-sev="high"   aria-pressed="false"><span class="glyph sev-high">▲</span> High</button>
      <button class="chip" data-sev="medium" aria-pressed="false"><span class="glyph sev-medium">◆</span> Medium</button>
      <button class="chip" data-sev="low"    aria-pressed="false"><span class="glyph sev-low">●</span> Low</button>
      <select id="projectFilter"><option value="">All projects</option></select>
      <input type="search" id="search" placeholder="Filter findings…  (press /)">
    </div>
    <div class="panel scroll">
      <table>
        <thead><tr><th>Severity</th><th>Project</th><th>Finding</th><th class="num">URLs</th></tr></thead>
        <tbody id="findingRows"></tbody>
      </table>
    </div>
  </section>

  <section id="panel-actions" role="tabpanel" hidden>
    <div class="filters">
      <button id="proposeBtn">Recompute proposals</button>
      <button id="eligibleBtn" title="Apply only what a class has earned under its own policy">Apply earned</button>
    </div>
    <div id="actionList"></div>
  </section>

  <section id="panel-drift" role="tabpanel" hidden>
    <div class="filters">
      <button class="chip" id="decisiveOnly" aria-pressed="true">Decisive only</button>
      <span class="hint">Measurements are tolerance-tested, so routine wobble never appears here.</span>
    </div>
    <div class="panel scroll"><div id="driftList"></div></div>
  </section>

  <section id="panel-rules" role="tabpanel" hidden>
    <div class="panel scroll"><div id="precisionList"></div></div>
  </section>
</div>

<script>
const SEV = {
  high:   { glyph: "▲", label: "High" },
  medium: { glyph: "◆", label: "Medium" },
  low:    { glyph: "●", label: "Low" },
};
const state = {
  findings: [], overview: null, actions: [], drift: [], precision: [],
  sevs: new Set(), project: "", q: "", open: new Set(),
  tab: "findings", decisiveOnly: true,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function ago(iso) {
  if (!iso) return "never";
  // Timestamps arrive as ISO-8601 with an explicit offset ("+00:00"). Appending
  // a Z to that is not a UTC hint, it is an invalid date — which rendered as
  // "NaNd ago".
  const stamped = /[Z+]|-\d\d:\d\d$/.test(iso) ? iso : iso + "Z";
  const ms = new Date(stamped).getTime();
  if (Number.isNaN(ms)) return "unknown";
  const secs = (Date.now() - ms) / 1000;
  if (secs < 90) return "just now";
  if (secs < 5400) return Math.round(secs / 60) + "m ago";
  if (secs < 172800) return Math.round(secs / 3600) + "h ago";
  return Math.round(secs / 86400) + "d ago";
}

async function load() {
  const [overview, findings, actions, drift, precision] = await Promise.all([
    fetch("/api/overview").then((r) => r.json()),
    fetch("/api/findings").then((r) => r.json()),
    fetch("/api/actions").then((r) => r.json()),
    fetch("/api/drift").then((r) => r.json()),
    fetch("/api/precision").then((r) => r.json()),
  ]);
  Object.assign(state, { overview, findings, actions, drift, precision });
  // Each panel renders independently. One throwing used to abort the rest of
  // load(), so a single bad reference blanked the whole page instead of one
  // section — a failure mode that is much harder to notice than an empty panel.
  for (const [name, render] of [
    ["overview", renderOverview], ["projects", renderProjects],
    ["findings", renderFindings], ["actions", renderActions],
    ["drift", renderDrift], ["rules", renderPrecision], ["counts", renderCounts],
  ]) {
    try {
      render();
    } catch (err) {
      console.error(`render failed: ${name}`, err);
    }
  }
}

function renderCounts() {
  $("countFindings").textContent = state.findings.length || "";
  $("countActions").textContent = state.actions.length || "";
  const drift = state.decisiveOnly ? state.drift.filter((d) => d.decisive) : state.drift;
  $("countDrift").textContent = drift.length || "";
}

// --- actions ---------------------------------------------------------------

function renderActions() {
  const list = $("actionList");
  if (!state.actions.length) {
    list.innerHTML =
      '<div class="panel"><div class="empty">Nothing pending. Recompute proposals after a sweep.</div></div>';
    return;
  }
  list.innerHTML = state.actions.map((a) => {
    const s = a.stats;
    // Both claims, kept apart: class_key counts "the same kind of action",
    // patch_digest counts "byte-identical to what you approved".
    const record = a.decided === 0
      ? "No prior decisions — this class is new."
      : `Approved ${s.approvals}/${a.decided} across ${s.projects} project(s)` +
        (s.rejections ? ` · <span class="was">${s.rejections} rejected</span>` : "") +
        (s.identical ? ` · patch identical to ${s.identical} of them` : "") +
        (s.failures ? ` · <span class="was">${s.failures} failed on apply</span>` : "");
    const pct = Math.min(100, (s.approvals / 10) * 100);
    return `<div class="action" data-id="${a.id}">
      <div class="action-head">
        <span class="verb">${esc(a.verb)}</span>
        <span class="project-cell">${esc(a.project)}</span>
        <span class="action-files">${a.files.map(esc).join(", ")}</span>
        <span style="margin-left:auto" class="badge${a.eligible ? " earned" : ""}">
          ${a.eligible ? "earned under policy" : "needs you"}</span>
      </div>
      <div class="evidence">
        <div class="evidence-text">${record}</div>
        ${a.decided === 0 ? "" :
          `<div class="meter${a.eligible ? " earned" : ""}"><span style="width:${pct}%"></span></div>`}
      </div>
      <div class="statement">${esc(a.statement)}</div>
      ${a.stale ? `<div class="stale">⚠ stale — ${esc(a.stale)}</div>` : ""}
      <div class="action-buttons">
        <button class="primary approve" ${a.stale ? "disabled" : ""}>Approve &amp; apply</button>
        <button class="reject">Reject</button>
      </div>
    </div>`;
  }).join("");

  list.querySelectorAll(".approve").forEach((b) =>
    b.addEventListener("click", () => decide(b.closest(".action").dataset.id, "approve")));
  list.querySelectorAll(".reject").forEach((b) =>
    b.addEventListener("click", () => decide(b.closest(".action").dataset.id, "reject")));
}

async function decide(id, verb) {
  // Approving writes to a repository, so it asks. Rejecting is reversible and
  // does not.
  if (verb === "approve" && !confirm("Apply this change to the working tree?")) return;
  const res = await fetch(`/api/actions/${id}/${verb}`, { method: "POST" });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    alert(body.detail || `Failed with ${res.status}`);
  }
  load();
}

// --- drift -----------------------------------------------------------------

function renderDrift() {
  const rows = state.decisiveOnly ? state.drift.filter((d) => d.decisive) : state.drift;
  const list = $("driftList");
  if (!rows.length) {
    list.innerHTML = `<div class="empty">${
      state.drift.length ? "No decisive changes. Untick to see measurements." : "No drift since the previous snapshot."
    }</div>`;
    return;
  }
  list.innerHTML = rows.slice(0, 200).map((d) => {
    const mark = d.kind === "added" ? '<span class="now">+</span>'
      : d.kind === "removed" ? '<span class="was">−</span>' : '<span class="sev-low">~</span>';
    const body = d.kind === "changed"
      ? `<div class="drift-val was">${esc(d.before)}</div><div class="drift-val now">${esc(d.after)}</div>`
      : `<div class="drift-val">${esc(d.kind === "added" ? d.after : d.before)}</div>`;
    return `<div class="drift">
      <div class="drift-head">${mark}
        <span class="project-cell">${esc(d.project)}/${esc(d.collector)}</span>
        <span class="rule-tag">${esc(d.key)}</span></div>
      <div class="drift-subject">${esc(d.subject)}</div>${body}</div>`;
  }).join("");
}

// --- rule precision --------------------------------------------------------

function renderPrecision() {
  const list = $("precisionList");
  if (!state.precision.length) {
    list.innerHTML =
      '<div class="empty">No decided findings yet. Precision stays unmeasured until you approve or reject actions.</div>';
    return;
  }
  list.innerHTML = state.precision.map((r) => {
    const acted = r.acted || 0, decided = r.decided;
    const rate = acted / decided;
    // Status colour, but the percentage is right there — colour is never the
    // only thing saying whether a rule is any good.
    const tone = rate < 0.5 ? "var(--high)" : rate < 0.8 ? "var(--medium)" : "var(--good)";
    return `<div class="rule-row">
      <div class="rule-head">
        <span class="rule-name">${esc(r.rule)}</span>
        <span class="src">${esc(r.source)}</span>
        <span class="rule-pct">${(rate * 100).toFixed(0)}% acted on · ${acted}/${decided}</span>
      </div>
      <div class="meter" style="margin-top:7px"><span style="width:${rate * 100}%;background:${tone}"></span></div>
    </div>`;
  }).join("");
}

function renderOverview() {
  const t = state.overview.totals;
  $("heroValue").textContent = t.open;
  $("heroBreak").textContent =
    t.open ? `${t.high} high · ${t.medium} medium · ${t.low} low` : "everything clear";
  $("lastRun").textContent = "· last swept " + ago(state.overview.last_run);
  $("heroNote").textContent = `across ${t.projects} project${t.projects === 1 ? "" : "s"}`;
  $("tiles").innerHTML = [
    ["Projects monitored", t.projects],
    ["High severity", t.high],
    ["Projects clean", `${t.clean} / ${t.projects}`],
  ].map(([label, value]) =>
    `<div class="tile"><div class="tile-label">${esc(label)}</div>
     <div class="tile-value">${esc(value)}</div></div>`).join("");

  const sel = $("projectFilter");
  const current = sel.value;
  sel.innerHTML = '<option value="">All projects</option>' +
    state.overview.projects.map((p) => `<option value="${esc(p.project)}">${esc(p.project)}</option>`).join("");
  sel.value = current;
}

function renderProjects() {
  const rows = state.overview.projects;
  $("projectRows").innerHTML = rows.length ? rows.map((p) => {
    const pills = p.total === 0
      ? '<span class="pill clean"><span class="glyph">✓</span> clean</span>'
      : ["high", "medium", "low"].filter((k) => p[k] > 0).map((k) =>
          `<span class="pill"><span class="glyph sev-${k}">${SEV[k].glyph}</span>${p[k]} ${SEV[k].label.toLowerCase()}</span>`
        ).join("");
    return `<div class="project-row" data-project="${esc(p.project)}">
      <span class="project-name">${esc(p.project)}</span>
      <span class="pills">${pills}</span>
      <span class="project-when">swept ${esc(ago(p.last_run))}</span></div>`;
  }).join("") : '<div class="empty">No projects collected yet. Run a sweep.</div>';

  document.querySelectorAll(".project-row").forEach((el) =>
    el.addEventListener("click", () => {
      $("projectFilter").value = el.dataset.project;
      state.project = el.dataset.project;
      renderFindings();
      document.querySelector("section").scrollIntoView({ behavior: "smooth", block: "start" });
    }));
}

function visible() {
  return state.findings.filter((f) =>
    (state.sevs.size === 0 || state.sevs.has(f.severity)) &&
    (!state.project || f.project === state.project) &&
    (!state.q || (f.summary + " " + f.rule + " " + (f.source || "") + " " + f.subjects.join(" "))
      .toLowerCase().includes(state.q)));
}

function renderFindings() {
  const rows = visible();
  if (!rows.length) {
    $("findingRows").innerHTML =
      `<tr><td colspan="4" class="empty">${state.findings.length ? "Nothing matches these filters." : "No findings yet. Run a sweep."}</td></tr>`;
    return;
  }
  $("findingRows").innerHTML = rows.map((f) => {
    const s = SEV[f.severity] || { glyph: "•", label: f.severity };
    const open = state.open.has(f.id);
    const detail = open ? `<tr class="detail"><td colspan="4"><div class="detail-inner">
        ${f.detail ? `<p>${esc(f.detail)}</p>` : ""}
        <div class="rule-tag">${esc(f.rule)}</div>
        <ul class="subjects">${f.subjects.map((u) => `<li>${esc(u)}</li>`).join("")}</ul>
      </div></td></tr>` : "";
    return `<tr class="row" data-id="${f.id}">
        <td><span class="sev sev-${esc(f.severity)}"><span class="glyph">${s.glyph}</span><span class="txt">${esc(s.label)}</span></span></td>
        <td class="project-cell">${esc(f.project)}</td>
        <td>${esc(f.summary)}${f.source && f.source.startsWith("agent:")
            ? `<span class="src" title="Reported by an agent, not a deterministic rule">${esc(f.source.slice(6))}</span>` : ""}</td>
        <td class="num">${f.subjects.length}</td>
      </tr>${detail}`;
  }).join("");

  document.querySelectorAll("tr.row").forEach((el) =>
    el.addEventListener("click", () => {
      const id = Number(el.dataset.id);
      state.open.has(id) ? state.open.delete(id) : state.open.add(id);
      renderFindings();
    }));
}

document.querySelectorAll(".chip").forEach((chip) =>
  chip.addEventListener("click", () => {
    const sev = chip.dataset.sev;
    state.sevs.has(sev) ? state.sevs.delete(sev) : state.sevs.add(sev);
    chip.setAttribute("aria-pressed", String(state.sevs.has(sev)));
    renderFindings();
  }));
$("projectFilter").addEventListener("change", (e) => { state.project = e.target.value; renderFindings(); });
$("search").addEventListener("input", (e) => { state.q = e.target.value.toLowerCase().trim(); renderFindings(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("search")) { e.preventDefault(); $("search").focus(); }
  if (e.key === "Escape") { state.open.clear(); renderFindings(); }
});

// Theme. localStorage can throw outright in a locked-down browser, so every
// access is guarded and the page renders correctly with no stored value.
const themeBtn = $("themeBtn");
try {
  const saved = localStorage.getItem("foreman-theme");
  if (saved) document.documentElement.dataset.theme = saved;
} catch {}
themeBtn.addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme &&
      matchMedia("(prefers-color-scheme: dark)").matches);
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("foreman-theme", next); } catch {}
});

// Sweep. The server allows one at a time; the button reflects that rather than
// letting a second click race the first.
const runBtn = $("runBtn"), logEl = $("log");
async function poll() {
  const job = await fetch("/api/run").then((r) => r.json());
  logEl.hidden = !job.log.length && !job.error;
  logEl.innerHTML = job.log.map(esc).join("\n") +
    (job.error ? `\n<span class="err">${esc(job.error)}</span>` : "");
  logEl.scrollTop = logEl.scrollHeight;
  runBtn.disabled = job.running;
  runBtn.textContent = job.running ? "Sweeping…" : "Run sweep";
  if (job.running) setTimeout(poll, 1000);
  else load();
}
runBtn.addEventListener("click", async () => {
  runBtn.disabled = true;
  runBtn.textContent = "Sweeping…";
  await fetch("/api/run", { method: "POST" });
  poll();
});

// --- tabs ------------------------------------------------------------------

function showTab(name) {
  state.tab = name;
  document.querySelectorAll(".tab").forEach((t) =>
    t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  for (const panel of ["findings", "actions", "drift", "rules"]) {
    $("panel-" + panel).hidden = panel !== name;
  }
  try { localStorage.setItem("foreman-tab", name); } catch {}
}

document.querySelectorAll(".tab").forEach((t) =>
  t.addEventListener("click", () => showTab(t.dataset.tab)));

$("decisiveOnly").addEventListener("click", () => {
  state.decisiveOnly = !state.decisiveOnly;
  $("decisiveOnly").setAttribute("aria-pressed", String(state.decisiveOnly));
  renderDrift();
  renderCounts();
});

$("proposeBtn").addEventListener("click", async () => {
  const btn = $("proposeBtn");
  btn.disabled = true;
  await fetch("/api/actions/propose", { method: "POST" });
  await load();
  btn.disabled = false;
  showTab("actions");
});

$("eligibleBtn").addEventListener("click", async () => {
  // Dry run first, always. The count is what the confirmation is about — a
  // prompt that cannot say how many files it will touch is not a confirmation.
  const preview = await fetch("/api/actions/apply-eligible", { method: "POST" }).then((r) => r.json());
  if (!preview.applied) {
    alert(`Nothing has earned it yet. ${preview.skipped} action(s) still need you.`);
    return;
  }
  if (!confirm(`Apply ${preview.applied} action(s) that their class has earned?`)) return;
  await fetch("/api/actions/apply-eligible?confirm=true", { method: "POST" });
  load();
});

try {
  const saved = localStorage.getItem("foreman-tab");
  if (saved) showTab(saved);
} catch {}

load();
poll();
</script>
</body>
</html>

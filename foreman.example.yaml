# Copy to foreman.yaml (gitignored) and fill in.
#
# A project is the unit. A website is one *surface* of a project — a project
# with no `web:` block is still a project, and the collectors that need a URL
# simply skip it.
#
# `repo` is the field that matters most: a project with a local checkout is one
# Foreman can open a pull request against, not just report on. That asymmetry is
# the whole argument for running this yourself rather than buying a seat.

# Where Foreman keeps state. `sqlite` needs nothing running and is the default;
# `shoal://host:port` uses a `shoal-embed serve` you start yourself, which buys
# cell versioning, point-in-time reads and compare-and-set at the cost of a
# daemon. Both are held to the same parity tests.
store: sqlite

projects:
  - id: mfa
    name: MyFinanceAdvisor
    repo: /mnt/ExtraDrive/repos/MyFinanceAdvisor-tres
    domains: [seo, security, performance]
    tags: [owned, production]
    web:
      url: https://www.myfinanceadvisor.com
      kind: spa          # spa | wordpress | static | other
      max_urls: 500
      render_sample: 5

  - id: example-client
    name: Example Client
    domains: [seo, security]
    tags: [client]
    web:
      url: https://example.com
      kind: wordpress
      max_urls: 200
    # No repo: monitored and reported on, never auto-fixed.

  - id: internal-lib
    name: Some library with no website
    repo: /path/to/repo
    domains: [security]
    tags: [internal]
    # No web surface. Crawl and TLS collectors skip it; security rules still apply.

  - id: platform
    name: The cloud account everything runs in
    domains: [cloud]
    tags: [internal]
    cloud:
      provider: gcp        # gcp | aws | azure
      account: acme-prod   # the GCP project id
    # Read through the already-authenticated `gcloud` CLI, the same way the
    # GitHub collectors read through `gh`. aws and azure are accepted and have
    # no collector — they report themselves as unmonitored rather than quietly
    # contributing nothing, because that is the half of the report you would
    # otherwise mistake for good news.

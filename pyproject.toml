[project]
# PyPI already has `foreman` and `foreman-cli` (both unrelated), so the
# distribution name is namespaced. The command you actually type stays `foreman`.
name = "foreman-portfolio"
version = "0.1.0"
description = "Portfolio control plane for SEO, security, and marketing across many sites."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "grpcio>=1.60",
    # The generated stubs import it directly; grpcio does not pull it in, so
    # without this a fresh install cannot talk to shoal at all.
    "protobuf>=4.25",
    "fastapi>=0.110",
    # 1.2.3 is the first release with the expression grammar ordered
    # tightest-first. Below it, `a>=10&&b==0` binds the other way and the
    # unattended-write gate silently means something else.
    "semantic-action-grammar>=1.2.3",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]

[project.scripts]
foreman = "foreman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foreman"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "src/foreman/shoalpb"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Generated from shoal's proto by grpc_tools; regenerated, never edited.
extend-exclude = ["src/foreman/shoalpb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 fires on every typer.Option(...) default, which is how the library is
# meant to be used.
per-file-ignores = { "src/foreman/cli.py" = ["B008"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
